name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TRIVY_VERSION: "0.74.0"
  TRIVY_DB_REPOSITORY: "public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2"
  TRIVY_NO_PROGRESS: "true"

jobs:
  # ============ STAGE 1: TEST ============
  test:
    name: 1. Test - ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            test: npm test -- --coverage --passWithNoTests
            build: npm run build
            artifact_path: |
              apps/api/dist
              apps/api/coverage
          - app: web
            test: npm test -- --watch=false
            build: npm run build -- --configuration production
            artifact_path: apps/web/dist
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: ${{ matrix.test }}
      - run: ${{ matrix.build }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-build-${{ github.sha }}
          path: ${{ matrix.artifact_path }}
          retention-days: 14

  # ============ STAGE 2: VALIDATE ============
  gitleaks:
    name: 2. Validate - Gitleaks
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-fs:
    name: 2. Validate - Trivy filesystem
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - name: Install Trivy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/trivy && cd /tmp/trivy
          gh release download "v${TRIVY_VERSION}" -R aquasecurity/trivy \
            -p '*Linux-64bit.tar.gz' -p '*checksums.txt'
          grep 'Linux-64bit.tar.gz$' ./*checksums.txt | sha256sum -c -
          sudo tar -xzf ./*Linux-64bit.tar.gz -C /usr/local/bin trivy
          trivy --version
      - name: Trivy fs scan
        run: trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .

  npm-audit:
    name: 2. Validate - npm audit
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          (cd apps/api && npm audit --omit=dev --audit-level=high)
          (cd apps/web && npm audit --omit=dev --audit-level=high)

  gate:
    name: 2. Validate - Gate
    needs: [test, gitleaks, trivy-fs, npm-audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq 'failure|cancelled'; then
            echo "::error::Gate FAILED"; exit 1
          fi
          echo "Gate passed."

  # ============ STAGE 3: VERSION (main only) ============
  version:
    name: 3. Version - semantic-release
    needs: [gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: npx semantic-release
      - name: Write release info
        run: |
          git pull --ff-only origin main || true
          VERSION=$(node -p "require('./package.json').version")
          SHA=$(git rev-parse HEAD)
          echo "{\"version\":\"$VERSION\",\"sha\":\"$SHA\"}" > release-info.json
          cat release-info.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-info
          path: release-info.json
          retention-days: 7
