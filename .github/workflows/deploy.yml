name: CD

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      sha:
        required: true
        type: string
      released:
        required: false
        default: "false"
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECS_CLUSTER: myapp-dev-ecs
  AWS_ROLE_ARN: arn:aws:iam::462446639312:role/myapp-github-deploy
  TRIVY_VERSION: "0.74.0"
  TRIVY_DB_REPOSITORY: "public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2"
  TRIVY_NO_PROGRESS: "true"

jobs:
  deploy:
    name: Deploy - ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            repo: myapp/dev/web
            family: myapp-web-task
            container: web
            service: myapp-web-svc
          - app: api
            repo: myapp/dev/api
            family: myapp-api-task
            container: api
            service: myapp-api-task-service
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Build image (once)
        run: |
          docker build --platform linux/amd64 --provenance=false \
            -t local/${{ matrix.app }}:build apps/${{ matrix.app }}

      - uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      - name: Install Trivy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/trivy && cd /tmp/trivy
          gh release download "v${TRIVY_VERSION}" -R aquasecurity/trivy \
            -p '*Linux-64bit.tar.gz' -p '*checksums.txt'
          grep 'Linux-64bit.tar.gz$' ./*checksums.txt | sha256sum -c -
          sudo tar -xzf ./*Linux-64bit.tar.gz -C /usr/local/bin trivy

      - name: Trivy image scan + SBOM (before push)
        run: |
          trivy image --format cyclonedx --output sbom-${{ matrix.app }}.json local/${{ matrix.app }}:build
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --format table --output trivy-${{ matrix.app }}.txt local/${{ matrix.app }}:build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-${{ matrix.app }}-${{ inputs.sha }}
          path: |
            sbom-${{ matrix.app }}.json
            trivy-${{ matrix.app }}.txt
          retention-days: 30

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image (SHA tag always, version tag only on release)
        id: image
        env:
          BASE: ${{ steps.ecr.outputs.registry }}/${{ matrix.repo }}
          REPO: ${{ matrix.repo }}
          APP: ${{ matrix.app }}
          SHA_TAG: ${{ inputs.sha }}
          VERSION_TAG: v${{ inputs.version }}
          RELEASED: ${{ inputs.released }}
        run: |
          set -euo pipefail

          # Returns 0 if the tag exists in ECR, 1 if it does not.
          # On unexpected errors (for example missing ecr:DescribeImages permission)
          # it warns and returns 1, so the push is attempted. An IMMUTABLE repository
          # will still reject a duplicate tag, which is the correct outcome.
          tag_exists() {
            local out
            if out=$(aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="$1" 2>&1); then
              return 0
            elif echo "$out" | grep -q 'ImageNotFoundException'; then
              return 1
            else
              echo "::warning::Could not check tag $1: $out"
              return 1
            fi
          }

          push_if_new() {
            local tag="$1"
            if tag_exists "$tag"; then
              echo "Tag $tag already exists in ECR, not pushing again."
            else
              docker tag "local/$APP:build" "$BASE:$tag"
              docker push "$BASE:$tag"
            fi
          }

          push_if_new "$SHA_TAG"
          if [ "$RELEASED" = "true" ]; then
            push_if_new "$VERSION_TAG"
          else
            echo "No release created for this commit, skipping version tag $VERSION_TAG."
          fi

          echo "image=$BASE:$SHA_TAG" >> "$GITHUB_OUTPUT"

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition --task-definition ${{ matrix.family }} \
            --query taskDefinition > task-def.json

      - name: Render task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: ${{ matrix.container }}
          image: ${{ steps.image.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ matrix.service }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 10